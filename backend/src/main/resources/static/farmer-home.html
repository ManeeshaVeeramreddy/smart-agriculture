<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Farm - Smart Farm</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/farmer.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-brand">🌾 <span data-i18n="app_name">Smart Farm</span></div>
        <div class="nav-user" id="nav-user-info"></div>
    </header>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-heading" data-i18n="sidebar_heading">Farmer Menu</div>
            <a href="farmer-home.html">🏠 My Farm</a>
            <a href="quick-check.html">🖐️ Check Soil</a>
            <a href="farmer-dashboard.html">📊 Full Dashboard</a>
            <a href="fields.html">🌱 Fields</a>
            <a href="crops.html">🌾 Crops</a>
            <a href="monitoring.html">🌡️ Enter Reading</a>
            <a href="monitoring-history.html">📜 History</a>
            <a href="alerts.html">🚨 Warnings</a>
            <a href="recommendation.html">💡 What to Grow</a>
            <div style="margin-top:auto; padding-top:1rem; border-top:1px solid var(--border-color);">
                <a href="#" onclick="Auth.logout()" style="color:var(--danger);">🚪 Logout</a>
            </div>
        </aside>

        <main class="main-content farm-home">
            <section class="hero-card">
                <h1 id="greeting">…</h1>
                <div class="hero-actions">
                    <button type="button" class="big-btn" id="listen-all">🔊 <span data-i18n="listen_all">Listen to today's advice</span></button>
                    <a class="big-btn secondary" href="quick-check.html">🖐️ <span data-i18n="nav_check">Check Soil</span></a>
                </div>
            </section>

            <div class="weather-strip hidden" id="weather-strip"></div>

            <div id="field-cards"><p data-i18n="loading">Loading…</p></div>

            <h2 data-i18n="more_tools">More tools</h2>
            <div class="tile-grid" id="tile-grid"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/advisor.js"></script>
    <script src="js/assistant.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/farmer-home.js"></script>
</body>
</html>
