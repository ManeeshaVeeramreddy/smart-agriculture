# ===================================================================
# SMART AGRICULTURE MONITORING SYSTEM (SAMS)
# Main Application Properties
# ===================================================================

# Active Profile: 'h2' by default for instant zero-config startup.
# To switch to MySQL, set SPRING_PROFILES_ACTIVE=mysql or pass --spring.profiles.active=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Server Port
server.port=8081

# Application Name
spring.application.name=smart-agriculture-backend

# Static resource serving (Frontend UI)
spring.web.resources.static-locations=classpath:/static/

# Open-in-view setting
spring.jpa.open-in-view=true

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
