# ===================================================================
# SMART AGRICULTURE MONITORING SYSTEM (SAMS)
# Application Properties - Standalone / H2 In-Memory Profile
# No local MySQL installation or password required!
# ===================================================================

# Server Port
server.port=8081

# Application Name
spring.application.name=smart-agriculture-backend

# H2 Database Configuration (In-Memory with MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:smart_agriculture;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Static resource serving (Frontend UI)
spring.web.resources.static-locations=classpath:/static/

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
