version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  sams-db:
    image: mysql:8.0
    container_name: sams-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sams_secure_password_2026
      MYSQL_DATABASE: smart_agriculture
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psams_secure_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sams-network

  # ----------------------------------------------------------------------------
  # Spring Boot & Frontend Web Service
  # ----------------------------------------------------------------------------
  sams-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sams-web-app
    restart: unless-stopped
    depends_on:
      sams-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://sams-db:3306/smart_agriculture?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: sams_secure_password_2026
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    networks:
      - sams-network

networks:
  sams-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
