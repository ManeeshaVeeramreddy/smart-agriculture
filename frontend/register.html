<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Agriculture Monitoring System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/farmer.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <h2>🌾 <span data-i18n="register_link">Create account</span></h2>
                <p data-i18n="reg_sub">Create your farmer account</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="name" data-i18n="reg_name">Your name</label>
                    <input type="text" id="name" class="form-control" placeholder="Ramesh Kumar" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone" data-i18n="reg_phone">Mobile number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="9876543210" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email" data-i18n="reg_email">Email (optional)</label>
                    <input type="email" id="email" class="form-control" placeholder="ramesh@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password" data-i18n="reg_pw">Password (min 6 characters)</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; min-height: 52px; font-size: 1.1rem;" data-i18n="register_link">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <span data-i18n="have_account">Already registered?</span> <a href="login.html"><strong data-i18n="login_btn">Login</strong></a><br>
                <small data-i18n="tap_mic_hint" style="color: var(--text-muted)"></small><br>
                <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; display: inline-block;">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
